name: Verify governance contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python simulation/reference_algorithms.py
      - run: python simulation/integration_tests.py
      - run: python -m unittest discover -s simulation -p 'test_*.py'
      - run: python simulation/workflow.py
      - run: python simulation/demo.py
